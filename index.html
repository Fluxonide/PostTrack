<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostTrack — Real-Time Shipment Tracking</title>
    <meta
      name="description"
      content="Unified multi-carrier shipment tracking with luxury dark mode UI for Blue Dart, Delhivery, ST Courier, Professional Couriers, Ekart, Amazon, and Shiprocket."
    />

    <!-- Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Theme Initialization Script (Prevents flash of wrong theme) -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem("posttrack_theme");
          var theme = stored || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.setAttribute("data-theme", theme);
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.add("light");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="glow-orb glow-orb-2"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
