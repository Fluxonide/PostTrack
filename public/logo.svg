<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a04a" />
      <stop offset="100%" stop-color="#c08532" />
    </linearGradient>
    <filter id="ptGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded card -->
  <rect x="2" y="2" width="36" height="36" rx="10" fill="#1a1710" stroke="rgba(212, 160, 74, 0.3)" stroke-width="1.5"/>
  <!-- Glowing subtle badge -->
  <rect x="2" y="2" width="36" height="36" rx="10" fill="url(#ptGrad)" opacity="0.08"/>
  <!-- Stylized Box / Parcel Isometric Vector -->
  <path d="M20 9L31 15.5V25.5L20 32L9 25.5V15.5L20 9Z" stroke="url(#ptGrad)" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M20 9V20.5M31 15.5L20 20.5M9 15.5L20 20.5" stroke="url(#ptGrad)" stroke-width="1.8" stroke-linejoin="round"/>
